<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#f4f2ed">
    <title>Russe — Entraînement</title>
    <meta name="description" content="Application d'entraînement de vocabulaire et conjugaison russe">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="feedback-overlay" id="feedbackOverlay" aria-hidden="true"></div>

    <div class="app-container" id="appContainer">
        <div class="score-display score-display-hidden" id="scoreDisplay" aria-hidden="true">
            <span class="score-percentage" id="scorePercentage">0%</span>
            <span class="score-detail" id="scoreDetail">0/0</span>
        </div>

        <main class="training-card">
            <div class="revision-info" id="revisionInfo" aria-live="polite"></div>

            <div class="correct-answer" id="correctAnswer" role="status" aria-live="polite"></div>

            <div class="question-area" id="questionArea">
                <div class="question-translation" id="questionTranslation">
                    <span class="word-display" id="wordDisplay"></span>
                </div>

                <div class="question-conjugation hidden" id="questionConjugation">
                    <div class="conj-header">
                        <span class="conj-intro">Conjuguez</span>
                        <span class="conj-irregular hidden" id="conjIrregular">Irrégulier</span>
                    </div>
                    <div class="conj-verb" id="conjVerb"></div>
                    <div class="conj-context">
                        <span class="conj-tense" id="conjTense"></span>
                        <span class="context-dot" aria-hidden="true"></span>
                        <span class="conj-pronoun" id="conjPronoun"></span>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="answerInput" class="answer-input" placeholder="Votre réponse"
                    aria-label="Votre réponse" autocomplete="one-time-code" autocapitalize="off" autocorrect="off"
                    spellcheck="false">
                <button id="validateBtn" class="validate-btn" type="button">
                    <span>Valider</span>
                    <span class="validate-icon" aria-hidden="true">→</span>
                </button>
            </div>
        </main>

        <section class="controls" aria-label="Paramètres">
            <button class="control-btn" id="dictBtn" type="button">
                <span class="control-icon" aria-hidden="true">Aa</span>
                <span class="control-text">
                    <span class="control-label">Dictionnaire</span>
                    <span class="control-status" id="dictStatus">Échantillon</span>
                </span>
            </button>
            <button class="control-btn" id="trainingBtn" type="button">
                <span class="control-icon" aria-hidden="true">↔</span>
                <span class="control-text">
                    <span class="control-label">Entraînement</span>
                    <span class="control-status" id="trainingStatus">Traduction</span>
                </span>
            </button>
            <button class="control-btn" id="verbBtn" type="button">
                <span class="control-icon control-icon-cyrillic" aria-hidden="true">Я</span>
                <span class="control-text">
                    <span class="control-label">Verbes</span>
                    <span class="control-status" id="verbStatus">Réguliers</span>
                </span>
            </button>
        </section>
    </div>

    <script src="dictionaries.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>

</html>
